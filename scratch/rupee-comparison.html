<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; padding: 20px; background: #fff; }
  .grid { display: flex; gap: 40px; align-items: flex-end; }
  .box { text-align: center; }
  svg { border: 1px solid #ddd; }
  .text-sample { font-size: 32px; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<h2>Rupee Comparison</h2>
<div class="grid">
  <div class="box">
    <h4>System Font ₹ (Arial / Sans)</h4>
    <div style="font-size: 64px; line-height: 1;">₹</div>
  </div>
  <div class="box">
    <h4>Lucide Path (exact)</h4>
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12" />
      <path d="M6 8h12" />
      <path d="m6 13 8.5 8" />
      <path d="M6 13h3" />
      <path d="M9 13c6.667 0 6.667-10 0-10" />
    </svg>
  </div>
  <div class="box">
    <h4>Lucide + Left Stem</h4>
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12" />
      <path d="M6 8h12" />
      <path d="M6 3v10" />
      <path d="M6 13h3" />
      <path d="M9 13c6.667 0 6.667-10 0-10" />
      <path d="m6 13 8.5 8" />
    </svg>
  </div>
  <div class="box">
    <h4>Current Broken Implementation</h4>
    <svg width="80" height="80" viewBox="0 0 100 100" fill="none" stroke="#c51b24" stroke-width="3">
      <!-- Old drawRupee approximation -->
      <line x1="20" y1="20" x2="80" y2="20" />
      <line x1="20" y1="45" x2="75" y2="45" />
      <line x1="30" y1="20" x2="30" y2="85" />
      <rect x="30" y="20" width="45" height="30" rx="4" />
      <line x1="35" y1="55" x2="78" y2="90" />
    </svg>
  </div>
</div>
</body>
</html>
