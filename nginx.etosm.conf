# Nginx config for ETOSM — /etc/nginx/sites-available/etosm
# Nginx serves React frontend static files directly from disk
# Backend API proxied to PM2 port 5007

server {
    listen 3006;
    server_name 31.97.237.122;

    # Serve React frontend static build files directly from disk
    root /var/www/projects/etosm/frontend/build;
    index index.html;

    # Reverse proxy API requests to the backend on port 5007
    location /api/ {
        proxy_pass http://127.0.0.1:5007/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
    }

    # Serve uploads (product images) from backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5007/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
    }

    # React Router SPA fallback — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
